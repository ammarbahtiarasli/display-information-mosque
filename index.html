<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Masjid Jami' Al-Karomah</title>
    <style>
      /* ── Reset & base ──────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --g0: #00c853;          /* hijau terang */
        --g1: #004c1b;          /* hijau gelap */
        --g0a: rgba(0,200,83,.18);
        --g1a: rgba(0,76,27,.35);
        --bg: #061009;
        --card-bg: rgba(255,255,255,.055);
        --card-bg2: rgba(0,200,83,.06);
        --stroke: rgba(0,200,83,.22);
        --stroke2: rgba(255,255,255,.1);
        --text: rgba(255,255,255,.92);
        --sub:  rgba(255,255,255,.72);
        --dim:  rgba(255,255,255,.45);
        --shadow: 0 8px 32px rgba(0,0,0,.45);
        --r: 18px;
        --rSm: 12px;
        --mono: ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }

      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
      }

      body {
        background:
          radial-gradient(ellipse 80vw 60vh at 10% 0%,  var(--g0a), transparent),
          radial-gradient(ellipse 60vw 50vh at 90% 80%, var(--g1a), transparent),
          var(--bg);
      }

      /* ── Root layout: header / main / footer ───────────────────── */
      .root {
        height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 0;
        overflow: hidden;
      }

      /* ── Header ─────────────────────────────────────────────────── */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 22px;
        background: linear-gradient(180deg, rgba(0,200,83,.18), rgba(0,200,83,.06));
        border-bottom: 1px solid var(--stroke);
      }

      .mosque-identity {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .mosque-icon {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--g1), rgba(0,200,83,.3));
        border: 1px solid var(--stroke);
        border-radius: 50%;
        font-size: 22px;
      }

      .mosque-text h1 {
        font-size: clamp(18px, 2.4vw, 28px);
        font-weight: 800;
        letter-spacing: .3px;
        line-height: 1.15;
      }

      .mosque-text .addr {
        font-size: clamp(11px, 1.2vw, 14px);
        color: var(--sub);
        margin-top: 2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .mosque-text .addr::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--g0);
        flex-shrink: 0;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .topbar-date {
        text-align: right;
        font-size: clamp(11px, 1.1vw, 13px);
        color: var(--sub);
        line-height: 1.4;
      }

      .live-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--stroke);
        background: rgba(0,200,83,.1);
        font-size: 12px;
        color: var(--sub);
        white-space: nowrap;
      }

      .live-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--g0);
        box-shadow: 0 0 0 4px rgba(0,200,83,.2);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 4px rgba(0,200,83,.2); }
        50%       { box-shadow: 0 0 0 8px rgba(0,200,83,.05); }
      }

      /* ── Main content ───────────────────────────────────────────── */
      .content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 16px 22px;
        min-height: 0;
        overflow: hidden;
      }

      @media (max-width: 860px) {
        .content { grid-template-columns: 1fr; overflow: auto; }
        .root { height: auto; min-height: 100dvh; }
      }

      /* ── Card base ──────────────────────────────────────────────── */
      .panel {
        background: var(--card-bg);
        border: 1px solid var(--stroke);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      .panel-head {
        padding: 14px 18px 10px;
        border-bottom: 1px solid var(--stroke2);
        flex-shrink: 0;
      }

      .panel-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--g0);
        font-weight: 700;
      }

      /* ── Left panel: clock ──────────────────────────────────────── */
      .left-panel { gap: 0; }

      .clock-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 18px 20px 12px;
        gap: 6px;
        background: linear-gradient(180deg, rgba(0,200,83,.12), rgba(0,76,27,.18));
      }

      .clock-time {
        font-family: var(--mono);
        font-size: clamp(64px, 10vw, 100px);
        font-weight: 800;
        letter-spacing: 2px;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 40px rgba(0,200,83,.45);
      }

      .clock-date-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .clock-date {
        font-size: clamp(13px, 1.4vw, 16px);
        color: var(--sub);
        font-weight: 500;
      }

      .tz-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--stroke);
        background: rgba(0,200,83,.12);
        font-size: 11px;
        color: var(--g0);
        font-weight: 700;
        letter-spacing: .5px;
      }

      /* ── Next prayer banner ─────────────────────────────────────── */
      .next-area {
        padding: 14px 20px;
        background: linear-gradient(135deg, rgba(0,76,27,.28), rgba(0,200,83,.14));
        border-top: 1px solid var(--stroke);
        flex-shrink: 0;
      }

      .next-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--sub);
        margin-bottom: 6px;
      }

      .next-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .next-name {
        font-size: clamp(22px, 2.8vw, 30px);
        font-weight: 800;
        color: var(--g0);
        letter-spacing: .2px;
      }

      .next-time {
        font-family: var(--mono);
        font-size: clamp(20px, 2.4vw, 26px);
        font-weight: 700;
        color: rgba(255,255,255,.88);
      }

      .countdown-row {
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .countdown {
        font-family: var(--mono);
        font-size: clamp(28px, 3.8vw, 44px);
        font-weight: 900;
        letter-spacing: 1px;
        color: #fff;
      }

      .countdown-sub {
        font-size: 12px;
        color: var(--sub);
      }

      /* ── Controls strip ─────────────────────────────────────────── */
      .controls-strip {
        padding: 12px 20px;
        border-top: 1px solid var(--stroke2);
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
        background: rgba(0,0,0,.15);
        flex-shrink: 0;
      }

      .ctrl-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px; }
      .ctrl-label { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); }

      select {
        font: inherit;
        color: var(--text);
        background: rgba(255,255,255,.07);
        border: 1px solid var(--stroke2);
        border-radius: var(--rSm);
        padding: 8px 10px;
        outline: none;
        width: 100%;
        cursor: pointer;
        appearance: auto;
      }

      select:focus { border-color: var(--g0); }

      .ctrl-btn {
        padding: 9px 18px;
        border-radius: var(--rSm);
        border: 1px solid var(--stroke);
        background: linear-gradient(135deg, rgba(0,200,83,.25), rgba(0,76,27,.2));
        color: var(--text);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: filter .15s;
        white-space: nowrap;
        align-self: flex-end;
      }
      .ctrl-btn:hover  { filter: brightness(1.1); }
      .ctrl-btn:active { transform: translateY(1px); }

      /* ── Right panel: prayer schedule ───────────────────────────── */
      .right-panel { }

      .prayer-grid {
        flex: 1;
        display: grid;
        grid-template-rows: repeat(5, 1fr);
        gap: 0;
        padding: 0;
        min-height: 0;
        overflow: hidden;
      }

      .prayer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 20px;
        border-bottom: 1px solid var(--stroke2);
        transition: background .2s;
        position: relative;
        overflow: hidden;
      }

      .prayer-row:last-child { border-bottom: none; }

      .prayer-row::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(0,200,83,.0), rgba(0,200,83,.0));
        transition: background .3s;
      }

      .prayer-row.is-next {
        background: linear-gradient(90deg, rgba(0,200,83,.14), rgba(0,76,27,.12));
        border-left: 4px solid var(--g0);
      }

      .prayer-row.is-next::before {
        background: linear-gradient(90deg, rgba(0,200,83,.06), rgba(0,200,83,.0));
      }

      .prayer-row.is-done {
        opacity: .55;
      }

      .pr-left {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .pr-icon {
        width: 42px; height: 42px;
        flex-shrink: 0;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 20px;
        background: rgba(0,200,83,.1);
        border: 1px solid var(--stroke);
      }

      .prayer-row.is-next .pr-icon {
        background: rgba(0,200,83,.22);
        border-color: var(--g0);
      }

      .pr-info { display: flex; flex-direction: column; gap: 2px; }

      .pr-name {
        font-size: clamp(16px, 1.8vw, 22px);
        font-weight: 800;
        letter-spacing: .2px;
      }

      .pr-arabic {
        font-size: clamp(10px, 1vw, 13px);
        color: var(--sub);
      }

      .prayer-row.is-next .pr-name { color: var(--g0); }

      .pr-time {
        font-family: var(--mono);
        font-size: clamp(24px, 2.8vw, 36px);
        font-weight: 800;
        letter-spacing: 1px;
        color: rgba(255,255,255,.92);
        flex-shrink: 0;
      }

      .prayer-row.is-next .pr-time { color: var(--g0); }

      .pr-next-badge {
        display: none;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--g0);
        background: rgba(0,200,83,.12);
        border: 1px solid rgba(0,200,83,.3);
        border-radius: 999px;
        padding: 2px 8px;
        white-space: nowrap;
      }

      .prayer-row.is-next .pr-next-badge { display: inline-block; }

      /* ── Footer ─────────────────────────────────────────────────── */
      .bottombar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 22px;
        border-top: 1px solid var(--stroke2);
        background: rgba(0,0,0,.2);
        flex-shrink: 0;
      }

      .status-text {
        font-size: 11px;
        color: var(--dim);
      }

      .bottom-right {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        color: var(--dim);
      }

      .srOnly {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </head>
  <body>
    <div class="root">

      <!-- ─── TOP BAR ─────────────────────────────────────── -->
      <header class="topbar" role="banner">
        <div class="mosque-identity">
          <div class="mosque-icon" aria-hidden="true">🕌</div>
          <div class="mosque-text">
            <h1>Masjid Jami' Al-Karomah</h1>
            <div class="addr">Kaca-kaca Pamijahan</div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="topbar-date" id="headerDate">—</div>
          <div class="live-pill" aria-label="Status: Live">
            <span class="live-dot" aria-hidden="true"></span>
            Live
          </div>
        </div>
      </header>

      <!-- ─── MAIN CONTENT ─────────────────────────────────── -->
      <main class="content" aria-label="Dashboard utama">

        <!-- ── LEFT: Jam + Next sholat + Kontrol ─────────── -->
        <section class="panel left-panel" aria-label="Jam dan info sholat berikutnya">

          <!-- Big clock -->
          <div class="clock-area">
            <div class="clock-time" id="clockTime">--:--:--</div>
            <div class="clock-date-row">
              <div class="clock-date" id="clockDate">—</div>
              <div class="tz-badge">WIB · GMT+7</div>
            </div>
          </div>

          <!-- Next prayer banner -->
          <div class="next-area" id="nextArea">
            <div class="next-label">Sholat Berikutnya</div>
            <div class="next-row">
              <span class="next-name" id="nextName">—</span>
              <span class="next-time" id="nextTime">—</span>
            </div>
            <div class="countdown-row">
              <span class="countdown" id="countdown">—</span>
              <span class="countdown-sub">lagi</span>
            </div>
          </div>

          <!-- Settings strip -->
          <div class="controls-strip" aria-label="Pengaturan kota">
            <div class="ctrl-group">
              <label class="ctrl-label" for="preset">Kota (WIB)</label>
              <select id="preset" aria-label="Pilih kota WIB"></select>
            </div>
            <div class="ctrl-group">
              <label class="ctrl-label" for="madhab">Madhab</label>
              <select id="madhab" aria-label="Pilih madhab">
                <option value="shafi">Syafi'i</option>
                <option value="hanafi">Hanafi</option>
              </select>
            </div>
            <button id="refreshBtn" class="ctrl-btn" type="button">↻ Refresh</button>
          </div>
        </section>

        <!-- ── RIGHT: Prayer schedule ─────────────────────── -->
        <aside class="panel right-panel" aria-label="Jadwal sholat hari ini">
          <div class="panel-head">
            <div class="panel-label">Jadwal Sholat · Hari Ini</div>
          </div>
          <div class="prayer-grid" id="prayerGrid" role="list"
               aria-label="Daftar jadwal sholat"></div>
        </aside>

      </main>

      <!-- ─── FOOTER ───────────────────────────────────────── -->
      <footer class="bottombar" role="contentinfo">
        <span class="status-text" id="statusText" role="status" aria-live="polite">
          Memuat jadwal sholat…
        </span>
        <div class="bottom-right">
          <span id="lastUpdated">—</span>
          <span>AlAdhan API · WIB</span>
        </div>
      </footer>

    </div><!-- .root -->

    <script>
      'use strict';
      const $ = id => document.getElementById(id);

      const WIB_TZ = 'Asia/Jakarta';

      const CITIES = [
        'Bogor', 'Bekasi', 'Depok', 'Tangerang', 'Jakarta',
        'Bandung', 'Cirebon', 'Semarang', 'Yogyakarta', 'Solo',
        'Surakarta', 'Surabaya', 'Malang', 'Kediri', 'Madiun',
        'Pontianak', 'Palembang', 'Pekanbaru', 'Padang', 'Medan',
        'Lampung', 'Cilacap', 'Jambi',
      ].map(c => ({ city: c, country: 'Indonesia' }));

      const PRAYERS = [
        { key: 'Fajr',    label: 'Subuh',   arabic: 'الفجر',   icon: '🌙' },
        { key: 'Dhuhr',   label: 'Dzuhur',  arabic: 'الظهر',   icon: '☀️' },
        { key: 'Asr',     label: 'Ashar',   arabic: 'العصر',   icon: '🌤' },
        { key: 'Maghrib', label: 'Maghrib', arabic: 'المغرب',  icon: '🌇' },
        { key: 'Isha',    label: 'Isya',    arabic: 'العشاء',  icon: '🌃' },
      ];

      const state = {
        tz: WIB_TZ,
        madhab: 'shafi',
        city: 'Bogor',
        country: 'Indonesia',
        timings: null,
      };

      /* ── helpers ─────────────────────────────── */
      function pad2(n) { return String(n).padStart(2, '0'); }

      function tzParts(date, tz) {
        const p = new Intl.DateTimeFormat('en-CA', {
          timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
        }).formatToParts(date);
        const g = t => p.find(x => x.type === t)?.value;
        const [y, mo, d, h, m, s] = [g('year'), g('month'), g('day'), g('hour'), g('minute'), g('second')];
        return (y && mo && d && h && m && s) ? { y, mo, d, h, m, s } : null;
      }

      function wallDate(date, tz) {
        const p = tzParts(date, tz);
        return p ? new Date(`${p.y}-${p.mo}-${p.d}T${p.h}:${p.m}:${p.s}`) : null;
      }

      function prayerWhen(hhmm, tz) {
        const clean = String(hhmm).trim();
        const m = clean.match(/^(\d{1,2}):(\d{2})/);
        if (!m) return null;
        const p = tzParts(new Date(), tz);
        if (!p) return null;
        return new Date(`${p.y}-${p.mo}-${p.d}T${pad2(+m[1])}:${pad2(+m[2])}:00`);
      }

      function msToHms(ms) {
        const t = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(t / 3600);
        const m = Math.floor((t % 3600) / 60);
        const s = t % 60;
        return h > 0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
      }

      function fmtDateLong(tz) {
        return new Intl.DateTimeFormat('id-ID', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
          timeZone: tz,
        }).format(new Date());
      }

      function setStatus(msg, kind = 'info') {
        const el = $('statusText');
        el.textContent = msg;
        el.style.color = kind === 'danger' ? '#fb7185' : kind === 'warn' ? '#fbbf24' : '';
      }

      /* ── Prefs / cache ───────────────────────── */
      function savePrefs() {
        localStorage.setItem('md2:prefs', JSON.stringify({
          city: state.city, country: state.country, madhab: state.madhab,
        }));
      }

      function loadPrefs() {
        try {
          const p = JSON.parse(localStorage.getItem('md2:prefs') || '{}');
          if (p.city)    state.city    = p.city;
          if (p.country) state.country = p.country;
          if (p.madhab === 'hanafi' || p.madhab === 'shafi') state.madhab = p.madhab;
        } catch { /* ignore */ }
      }

      function saveTimings(timings) {
        localStorage.setItem('md2:timings', JSON.stringify({ timings, savedAt: Date.now() }));
      }

      function loadTimings() {
        try { return JSON.parse(localStorage.getItem('md2:timings') || 'null'); } catch { return null; }
      }

      /* ── Clock ───────────────────────────────── */
      function renderClock() {
        const p = tzParts(new Date(), WIB_TZ);
        if (p) $('clockTime').textContent = `${p.h}:${p.m}:${p.s}`;
        $('clockDate').textContent = fmtDateLong(WIB_TZ);
        $('headerDate').textContent = fmtDateLong(WIB_TZ);
      }

      /* ── Next prayer & countdown ─────────────── */
      function findNext() {
        if (!state.timings) return null;
        const now = wallDate(new Date(), WIB_TZ);
        if (!now) return null;
        const sched = PRAYERS.map(p => ({
          ...p, time: state.timings[p.key],
          when: prayerWhen(state.timings[p.key], WIB_TZ),
        })).filter(x => x.when);
        sched.sort((a, b) => a.when - b.when);
        return sched.find(x => x.when > now) || { ...sched[0], isTomorrow: true };
      }

      function renderNext() {
        const next = findNext();
        if (!next) {
          $('nextName').textContent = '—';
          $('nextTime').textContent = '—';
          $('countdown').textContent = '—';
          return;
        }
        const now = wallDate(new Date(), WIB_TZ);
        const diff = next.when - now;
        $('nextName').textContent = next.label + (next.isTomorrow ? ' (besok)' : '');
        $('nextTime').textContent  = String(next.time).slice(0, 5);
        $('countdown').textContent = msToHms(diff);
      }

      /* ── Prayer grid ─────────────────────────── */
      function renderGrid() {
        const grid = $('prayerGrid');
        grid.innerHTML = '';
        if (!state.timings) return;

        const now = wallDate(new Date(), WIB_TZ);
        const next = findNext();

        PRAYERS.forEach(p => {
          const t = state.timings[p.key];
          const when = prayerWhen(t, WIB_TZ);
          const isNext = next?.key === p.key && !next?.isTomorrow;
          const isDone = now && when && when < now && !isNext;

          const row = document.createElement('div');
          row.className = 'prayer-row' + (isNext ? ' is-next' : '') + (isDone ? ' is-done' : '');
          row.setAttribute('role', 'listitem');
          row.innerHTML = `
            <div class="pr-left">
              <div class="pr-icon" aria-hidden="true">${p.icon}</div>
              <div class="pr-info">
                <div class="pr-name">${p.label}</div>
                <div class="pr-arabic">${p.arabic}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:14px">
              <span class="pr-next-badge">Berikutnya</span>
              <span class="pr-time">${t ? String(t).slice(0, 5) : '—'}</span>
            </div>
          `;
          grid.appendChild(row);
        });
      }

      /* ── Fetch API ───────────────────────────── */
      async function fetchTimings() {
        const tz = WIB_TZ;
        const today = new Intl.DateTimeFormat('en-CA', {
          timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
        }).format(new Date());
        const school = state.madhab === 'hanafi' ? 1 : 0;
        const url = `https://api.aladhan.com/v1/timingsByCity`
          + `?city=${encodeURIComponent(state.city)}`
          + `&country=${encodeURIComponent(state.country)}`
          + `&date=${encodeURIComponent(today)}`
          + `&method=11&school=${school}`;

        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (json?.code !== 200 || !json?.data?.timings) throw new Error('Format tidak sesuai');
        return json.data.timings;
      }

      async function refresh() {
        setStatus('Memuat jadwal sholat…');
        try {
          const timings = await fetchTimings();
          state.timings = timings;
          saveTimings(timings);
          renderGrid();
          const ts = new Intl.DateTimeFormat('id-ID', {
            dateStyle: 'medium', timeStyle: 'short', timeZone: WIB_TZ,
          }).format(new Date());
          $('lastUpdated').textContent = `Diperbarui: ${ts}`;
          setStatus(`Jadwal ${state.city} berhasil dimuat`);
        } catch (e) {
          const cached = loadTimings();
          if (cached?.timings) {
            state.timings = cached.timings;
            renderGrid();
            setStatus('Gagal memuat — menampilkan data tersimpan', 'warn');
          } else {
            setStatus(`Gagal: ${e.message}`, 'danger');
          }
        }
      }

      /* ── UI hydration ────────────────────────── */
      function populateCitySelect() {
        const sel = $('preset');
        sel.innerHTML = '';
        CITIES.forEach((c, i) => {
          const opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = c.city;
          sel.appendChild(opt);
        });
        const idx = Math.max(0, CITIES.findIndex(c => c.city === state.city));
        sel.value = String(idx >= 0 ? idx : 0);
      }

      function wire() {
        $('preset').addEventListener('change', e => {
          const c = CITIES[+e.target.value];
          if (c) { state.city = c.city; state.country = c.country; savePrefs(); refresh(); }
        });
        $('madhab').addEventListener('change', e => {
          state.madhab = e.target.value; savePrefs(); refresh();
        });
        $('refreshBtn').addEventListener('click', refresh);
      }

      function startTick() {
        renderClock();
        renderNext();
        setInterval(() => { renderClock(); renderNext(); }, 1000);

        // re-fetch every hour to keep timings fresh
        setInterval(refresh, 60 * 60 * 1000);
      }

      /* ── Boot ────────────────────────────────── */
      function init() {
        loadPrefs();
        $('madhab').value = state.madhab;
        populateCitySelect();
        wire();
        startTick();

        const cached = loadTimings();
        if (cached?.timings) {
          state.timings = cached.timings;
          renderGrid();
          const ts = new Intl.DateTimeFormat('id-ID', {
            dateStyle: 'medium', timeStyle: 'short', timeZone: WIB_TZ,
          }).format(new Date(cached.savedAt));
          $('lastUpdated').textContent = `Cache: ${ts}`;
          setStatus('Data tersimpan ditampilkan. Sedang refresh…');
        }
        refresh();
      }

      init();
    </script>
  </body>
</html>
