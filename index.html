<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masjid Jami' Al-Karomah</title>
    <style>
      /* ── Reset ─────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --green:      #00c853;
        --green-dark: #004c1b;
        --green-mid:  #007a33;
        --white:      #ffffff;
        --glass:      rgba(255,255,255,0.82);
        --glass2:     rgba(255,255,255,0.65);
        --border:     rgba(0,200,83,0.30);
        --border2:    rgba(0,200,83,0.18);
        --text:       #0d1f12;
        --sub:        #3a5445;
        --dim:        #6b8a76;
        --shadow:     0 4px 24px rgba(0,0,0,0.18);
        --shadow-sm:  0 2px 12px rgba(0,0,0,0.12);
        --r:          16px;
        --mono:       ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,Consolas,monospace;
        --sans:       ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
      }

      html, body {
        height: 100%;
        font-family: var(--sans);
        color: var(--text);
      }

      /* ── Background mosque image ────────────────────────────── */
      body {
        background:
          /* light white overlay for readability */
          linear-gradient(rgba(255,255,255,0.68), rgba(255,255,255,0.72)),
          url('https://images.unsplash.com/photo-1591604466107-ec97de577aff?w=1920&q=85&auto=format&fit=crop')
          center/cover no-repeat fixed;
        min-height: 100dvh;
      }

      /* ── Root: header / main / footer ──────────────────────── */
      .root {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      /* ══════════════════════════════════════════════════════════
         HEADER
      ══════════════════════════════════════════════════════════ */
      .topbar {
        background: var(--glass);
        border-bottom: 2px solid var(--green);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 16px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .mosque-id {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .mosque-emblem {
        width: 52px; height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--green-dark), var(--green));
        display: grid;
        place-items: center;
        font-size: 26px;
        flex-shrink: 0;
        box-shadow: var(--shadow-sm);
      }

      .mosque-words h1 {
        font-size: clamp(18px, 2.4vw, 26px);
        font-weight: 800;
        color: var(--green-dark);
        letter-spacing: .2px;
        line-height: 1.2;
      }

      .mosque-addr {
        margin-top: 3px;
        font-size: clamp(11px, 1.2vw, 14px);
        color: var(--sub);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .mosque-addr::before {
        content: '';
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--green);
        flex-shrink: 0;
      }

      /* Live chip */
      .live-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--green-dark);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .4px;
        box-shadow: var(--shadow-sm);
        flex-shrink: 0;
      }

      .live-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 3px rgba(0,200,83,.35);
        animation: blink 2s ease-in-out infinite;
      }

      @keyframes blink {
        0%,100% { opacity: 1; }
        50%      { opacity: .4; }
      }

      /* ══════════════════════════════════════════════════════════
         MAIN
      ══════════════════════════════════════════════════════════ */
      .content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 20px 28px;
        align-items: start;
      }

      @media (max-width: 820px) {
        .content { grid-template-columns: 1fr; }
      }

      /* ── Glass card base ───────────────────────────────────── */
      .card {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        overflow: hidden;
      }

      .card-header {
        background: linear-gradient(90deg, var(--green-dark), var(--green-mid));
        color: #fff;
        padding: 10px 20px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      /* ══════════════════════════════════════════════════════════
         LEFT — Clock + Next prayer
      ══════════════════════════════════════════════════════════ */

      /* Big clock block */
      .clock-block {
        padding: 28px 24px 20px;
        text-align: center;
        border-bottom: 1px solid var(--border2);
      }

      .clock-time {
        font-family: var(--mono);
        font-size: clamp(64px, 9vw, 96px);
        font-weight: 900;
        color: var(--green-dark);
        letter-spacing: 2px;
        line-height: 1;
      }

      .clock-date {
        margin-top: 8px;
        font-size: clamp(13px, 1.4vw, 16px);
        color: var(--sub);
        font-weight: 500;
      }

      .tz-tag {
        display: inline-block;
        margin-top: 10px;
        padding: 4px 14px;
        border-radius: 999px;
        background: var(--green);
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .8px;
      }

      /* Next prayer block */
      .next-block {
        padding: 18px 24px 20px;
        border-bottom: 1px solid var(--border2);
      }

      .next-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--dim);
        margin-bottom: 10px;
        font-weight: 700;
      }

      .next-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .next-name {
        font-size: clamp(22px, 2.8vw, 30px);
        font-weight: 900;
        color: var(--green-dark);
      }

      .next-time-val {
        font-family: var(--mono);
        font-size: clamp(20px, 2.4vw, 26px);
        font-weight: 700;
        color: var(--green-mid);
      }

      .countdown-val {
        margin-top: 6px;
        font-family: var(--mono);
        font-size: clamp(34px, 4.5vw, 52px);
        font-weight: 900;
        color: var(--green-dark);
        letter-spacing: 1px;
      }

      .countdown-caption {
        font-size: 12px;
        color: var(--dim);
        margin-top: 2px;
      }

      /* Settings strip */
      .ctrl-strip {
        padding: 14px 24px;
        display: flex;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
        background: rgba(255,255,255,.5);
      }

      .ctrl-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 110px; }

      .ctrl-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .8px;
        color: var(--dim);
        font-weight: 700;
      }

      select {
        font: inherit;
        color: var(--text);
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        outline: none;
        width: 100%;
        cursor: pointer;
        font-size: 13px;
      }

      select:focus { border-color: var(--green); }

      .ctrl-btn {
        padding: 9px 20px;
        border-radius: 10px;
        border: none;
        background: var(--green-dark);
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: filter .15s, transform .1s;
        white-space: nowrap;
        align-self: flex-end;
      }

      .ctrl-btn:hover  { filter: brightness(1.15); }
      .ctrl-btn:active { transform: translateY(1px); }

      /* ══════════════════════════════════════════════════════════
         RIGHT — Prayer schedule
      ══════════════════════════════════════════════════════════ */
      .prayer-list {
        display: flex;
        flex-direction: column;
      }

      .prayer-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        border-bottom: 1px solid var(--border2);
        transition: background .2s;
        position: relative;
      }

      .prayer-row:last-child { border-bottom: none; }

      /* highlight next */
      .prayer-row.is-next {
        background: rgba(0,200,83,.1);
        border-left: 4px solid var(--green);
      }

      /* dim done */
      .prayer-row.is-done { opacity: .5; }

      .pr-icon {
        width: 44px; height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 22px;
        background: rgba(0,200,83,.12);
        border: 1px solid var(--border2);
        flex-shrink: 0;
      }

      .prayer-row.is-next .pr-icon {
        background: var(--green);
        border-color: var(--green-dark);
      }

      .pr-info { flex: 1; min-width: 0; }

      .pr-name {
        font-size: clamp(15px, 1.8vw, 19px);
        font-weight: 800;
        color: var(--text);
        line-height: 1.2;
      }

      .prayer-row.is-next .pr-name { color: var(--green-dark); }

      .pr-arabic {
        font-size: 12px;
        color: var(--dim);
        margin-top: 2px;
      }

      .pr-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        flex-shrink: 0;
      }

      .pr-time {
        font-family: var(--mono);
        font-size: clamp(22px, 2.6vw, 30px);
        font-weight: 900;
        color: var(--text);
        letter-spacing: .5px;
      }

      .prayer-row.is-next .pr-time { color: var(--green-dark); }

      .pr-next-tag {
        display: none;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .8px;
        font-weight: 800;
        color: #fff;
        background: var(--green);
        border-radius: 999px;
        padding: 2px 10px;
      }

      .prayer-row.is-next .pr-next-tag { display: inline-block; }

      /* ══════════════════════════════════════════════════════════
         FOOTER
      ══════════════════════════════════════════════════════════ */
      .bottombar {
        background: var(--glass2);
        border-top: 1px solid var(--border2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 8px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .status-msg {
        font-size: 11px;
        color: var(--dim);
      }

      .bottom-meta {
        font-size: 11px;
        color: var(--dim);
        display: flex;
        gap: 12px;
      }

      .srOnly {
        position: absolute; width:1px; height:1px;
        padding:0; margin:-1px; overflow:hidden;
        clip:rect(0,0,0,0); white-space:nowrap; border-width:0;
      }
    </style>
  </head>
  <body>
    <div class="root">

      <!-- ── HEADER ──────────────────────────────────────── -->
      <header class="topbar">
        <div class="mosque-id">
          <div class="mosque-emblem" aria-hidden="true">🕌</div>
          <div class="mosque-words">
            <h1>Masjid Jami' Al-Karomah</h1>
            <div class="mosque-addr">Kaca-kaca Pamijahan</div>
          </div>
        </div>
        <div class="live-chip">
          <span class="live-dot" aria-hidden="true"></span>
          LIVE
        </div>
      </header>

      <!-- ── MAIN ────────────────────────────────────────── -->
      <main class="content">

        <!-- Left: Clock + next + settings -->
        <section class="card" aria-label="Jam dan sholat berikutnya">
          <div class="card-header">Waktu · WIB</div>

          <div class="clock-block">
            <div class="clock-time" id="clockTime">--:--:--</div>
            <div class="clock-date" id="clockDate">—</div>
            <div class="tz-tag">WIB · GMT+7</div>
          </div>

          <div class="next-block">
            <div class="next-label">Sholat Berikutnya</div>
            <div class="next-row">
              <span class="next-name" id="nextName">—</span>
              <span class="next-time-val" id="nextTimeVal">—</span>
            </div>
            <div class="countdown-val" id="countdown">—</div>
            <div class="countdown-caption">lagi</div>
          </div>

          <div class="ctrl-strip">
            <div class="ctrl-group">
              <span class="ctrl-label">Kota</span>
              <select id="preset" aria-label="Pilih kota WIB"></select>
            </div>
            <div class="ctrl-group">
              <span class="ctrl-label">Madhab</span>
              <select id="madhab" aria-label="Pilih madhab">
                <option value="shafi">Syafi'i</option>
                <option value="hanafi">Hanafi</option>
              </select>
            </div>
            <button id="refreshBtn" class="ctrl-btn" type="button">↻ Refresh</button>
          </div>
        </section>

        <!-- Right: Prayer schedule -->
        <aside class="card" aria-label="Jadwal sholat hari ini">
          <div class="card-header">Jadwal Sholat · Hari Ini</div>
          <div class="prayer-list" id="prayerList" role="list"></div>
        </aside>

      </main>

      <!-- ── FOOTER ──────────────────────────────────────── -->
      <footer class="bottombar">
        <span class="status-msg" id="statusText" role="status" aria-live="polite">Memuat jadwal…</span>
        <div class="bottom-meta">
          <span id="lastUpdated">—</span>
          <span>AlAdhan API · WIB</span>
        </div>
      </footer>

    </div>

    <script>
      'use strict';
      const $ = id => document.getElementById(id);
      const WIB_TZ = 'Asia/Jakarta';

      const CITIES = [
        'Bogor','Jakarta','Bekasi','Depok','Tangerang','Bandung',
        'Cirebon','Semarang','Yogyakarta','Solo','Surakarta',
        'Surabaya','Malang','Kediri','Madiun','Pontianak',
        'Palembang','Pekanbaru','Padang','Medan','Lampung','Jambi',
      ].map(c => ({ city: c, country: 'Indonesia' }));

      const PRAYERS = [
        { key:'Fajr',    label:'Subuh',   arabic:'الفجر',  icon:'🌙' },
        { key:'Dhuhr',   label:'Dzuhur',  arabic:'الظهر',  icon:'☀️' },
        { key:'Asr',     label:'Ashar',   arabic:'العصر',  icon:'🌤' },
        { key:'Maghrib', label:'Maghrib', arabic:'المغرب', icon:'🌇' },
        { key:'Isha',    label:'Isya',    arabic:'العشاء', icon:'🌃' },
      ];

      const state = {
        madhab: 'shafi', city: 'Bogor', country: 'Indonesia', timings: null,
      };

      /* helpers */
      const pad2 = n => String(n).padStart(2,'0');

      function tzParts(date) {
        const p = new Intl.DateTimeFormat('en-CA', {
          timeZone: WIB_TZ, year:'numeric', month:'2-digit', day:'2-digit',
          hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false,
        }).formatToParts(date);
        const g = t => p.find(x => x.type === t)?.value;
        const [y,mo,d,h,m,s] = [g('year'),g('month'),g('day'),g('hour'),g('minute'),g('second')];
        return (y&&mo&&d&&h&&m&&s) ? {y,mo,d,h,m,s} : null;
      }

      function wallDate(date) {
        const p = tzParts(date);
        return p ? new Date(`${p.y}-${p.mo}-${p.d}T${p.h}:${p.m}:${p.s}`) : null;
      }

      function prayerWhen(hhmm) {
        const m = String(hhmm).trim().match(/^(\d{1,2}):(\d{2})/);
        if (!m) return null;
        const p = tzParts(new Date());
        return p ? new Date(`${p.y}-${p.mo}-${p.d}T${pad2(+m[1])}:${pad2(+m[2])}:00`) : null;
      }

      function msToHms(ms) {
        const t = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
        return h > 0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
      }

      function dateLong() {
        return new Intl.DateTimeFormat('id-ID', {
          weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone: WIB_TZ,
        }).format(new Date());
      }

      function setStatus(msg, kind='info') {
        const el = $('statusText');
        el.textContent = msg;
        el.style.color = kind==='danger' ? '#e53935' : kind==='warn' ? '#f59e0b' : '';
      }

      /* prefs / cache */
      function savePrefs() {
        localStorage.setItem('mjak:prefs', JSON.stringify({city:state.city,country:state.country,madhab:state.madhab}));
      }
      function loadPrefs() {
        try {
          const p = JSON.parse(localStorage.getItem('mjak:prefs') || '{}');
          if (p.city)    state.city    = p.city;
          if (p.country) state.country = p.country;
          if (p.madhab === 'hanafi' || p.madhab === 'shafi') state.madhab = p.madhab;
        } catch {}
      }
      function saveTimings(t) { localStorage.setItem('mjak:timings', JSON.stringify({timings:t,at:Date.now()})); }
      function loadTimings()  { try { return JSON.parse(localStorage.getItem('mjak:timings')||'null'); } catch { return null; } }

      /* clock */
      function renderClock() {
        const p = tzParts(new Date());
        if (p) $('clockTime').textContent = `${p.h}:${p.m}:${p.s}`;
        $('clockDate').textContent = dateLong();
      }

      /* next prayer */
      function findNext() {
        if (!state.timings) return null;
        const now = wallDate(new Date());
        if (!now) return null;
        const sched = PRAYERS.map(p => ({...p, when: prayerWhen(state.timings[p.key])}))
          .filter(x => x.when);
        sched.sort((a,b) => a.when - b.when);
        return sched.find(x => x.when > now) || {...sched[0], isTomorrow: true};
      }

      function renderNext() {
        const next = findNext();
        if (!next) { $('nextName').textContent='—'; $('nextTimeVal').textContent='—'; $('countdown').textContent='—'; return; }
        const now = wallDate(new Date());
        $('nextName').textContent     = next.label + (next.isTomorrow ? ' (besok)' : '');
        $('nextTimeVal').textContent  = String(state.timings[next.key]).slice(0,5);
        $('countdown').textContent    = msToHms(next.when - now);
      }

      /* prayer list */
      function renderList() {
        const list = $('prayerList');
        list.innerHTML = '';
        if (!state.timings) return;
        const now  = wallDate(new Date());
        const next = findNext();

        PRAYERS.forEach(p => {
          const t    = state.timings[p.key];
          const when = prayerWhen(t);
          const isNext = next?.key === p.key && !next?.isTomorrow;
          const isDone = now && when && when < now && !isNext;

          const row = document.createElement('div');
          row.className = 'prayer-row' + (isNext?' is-next':'') + (isDone?' is-done':'');
          row.setAttribute('role','listitem');
          row.innerHTML = `
            <div class="pr-icon" aria-hidden="true">${p.icon}</div>
            <div class="pr-info">
              <div class="pr-name">${p.label}</div>
              <div class="pr-arabic">${p.arabic}</div>
            </div>
            <div class="pr-right">
              <span class="pr-next-tag">Berikutnya</span>
              <span class="pr-time">${t ? String(t).slice(0,5) : '—'}</span>
            </div>`;
          list.appendChild(row);
        });
      }

      /* fetch */
      async function fetchTimings() {
        const today = new Intl.DateTimeFormat('en-CA',{timeZone:WIB_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
        const url = `https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(state.city)}&country=${encodeURIComponent(state.country)}&date=${encodeURIComponent(today)}&method=11&school=${state.madhab==='hanafi'?1:0}`;
        const res = await fetch(url, {cache:'no-store'});
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (json?.code !== 200 || !json?.data?.timings) throw new Error('Format tidak valid');
        return json.data.timings;
      }

      async function refresh() {
        setStatus('Memuat jadwal sholat…');
        try {
          const timings = await fetchTimings();
          state.timings = timings;
          saveTimings(timings);
          renderList();
          $('lastUpdated').textContent = 'Diperbarui: ' + new Intl.DateTimeFormat('id-ID',{
            dateStyle:'medium', timeStyle:'short', timeZone:WIB_TZ,
          }).format(new Date());
          setStatus(`Jadwal ${state.city} berhasil dimuat`);
        } catch (e) {
          const cached = loadTimings();
          if (cached?.timings) {
            state.timings = cached.timings;
            renderList();
            setStatus('Gagal memuat — menampilkan cache', 'warn');
          } else {
            setStatus('Gagal memuat jadwal: ' + e.message, 'danger');
          }
        }
      }

      /* city select */
      function populateCities() {
        const sel = $('preset');
        CITIES.forEach((c,i) => {
          const o = document.createElement('option');
          o.value = String(i); o.textContent = c.city; sel.appendChild(o);
        });
        const idx = CITIES.findIndex(c => c.city === state.city);
        sel.value = String(idx >= 0 ? idx : 0);
      }

      /* wire */
      function wire() {
        $('preset').addEventListener('change', e => {
          const c = CITIES[+e.target.value];
          if (c) { state.city=c.city; state.country=c.country; savePrefs(); refresh(); }
        });
        $('madhab').addEventListener('change', e => {
          state.madhab = e.target.value; savePrefs(); refresh();
        });
        $('refreshBtn').addEventListener('click', refresh);
      }

      /* boot */
      function init() {
        loadPrefs();
        $('madhab').value = state.madhab;
        populateCities();
        wire();

        renderClock();
        setInterval(() => { renderClock(); renderNext(); renderList(); }, 1000);
        setInterval(refresh, 3600_000);

        const cached = loadTimings();
        if (cached?.timings) {
          state.timings = cached.timings;
          renderList();
          $('lastUpdated').textContent = 'Cache: ' + new Intl.DateTimeFormat('id-ID',{
            dateStyle:'medium', timeStyle:'short', timeZone:WIB_TZ,
          }).format(new Date(cached.at));
          setStatus('Cache ditampilkan. Sedang refresh…');
        }
        refresh();
      }

      init();
    </script>
  </body>
</html>
